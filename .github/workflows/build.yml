# Builds Pixbot.exe and the PixbotSetup.exe installer from this exact source code on
# GitHub's own servers, so anyone can see how the downloads were made.
#  - every push: builds both and keeps them as a downloadable artifact
#  - pushing a tag like v1.1.0: also creates a Release with both files attached
name: Build Pixbot

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Make sure Inno Setup is available (for the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Pixbot.exe and PixbotSetup.exe
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $env:PIXBOT_VERSION = "${{ github.ref_name }}".TrimStart("v") }
          ./build.ps1
          if (-not (Test-Path dist/PixbotSetup.exe)) { throw "installer was not built" }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in "Pixbot.exe", "PixbotSetup.exe") {
            "$((Get-FileHash dist/$f -Algorithm SHA256).Hash)  $f"
          }
          $lines | Out-File dist/SHA256.txt -Encoding ascii
          $lines

      - uses: actions/upload-artifact@v4
        with:
          name: Pixbot
          path: |
            dist/PixbotSetup.exe
            dist/Pixbot.exe
            dist/SHA256.txt

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/PixbotSetup.exe dist/Pixbot.exe dist/SHA256.txt --title "Pixbot ${{ github.ref_name }}" --generate-notes
