# Builds every Pixbot download from this exact source code on GitHub's own servers,
# so anyone can see how they were made:
#   Windows: Pixbot-Installer.exe + portable Pixbot.exe
#   Linux:   Pixbot-x86_64.AppImage (also started on a virtual screen to check it works)
#  - every push: builds them and keeps them as a downloadable artifact
#  - pushing a tag like v1.2.0: also creates a Release with all of them attached
name: Build Pixbot

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Make sure Inno Setup is available (for the installer)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Pixbot.exe and Pixbot-Installer.exe
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $env:PIXBOT_VERSION = "${{ github.ref_name }}".TrimStart("v") }
          ./build.ps1
          if (-not (Test-Path dist/Pixbot-Installer.exe)) { throw "installer was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: Pixbot-windows
          path: |
            dist/Pixbot-Installer.exe
            dist/Pixbot.exe

  linux:
    # built on an older Ubuntu so the AppImage also runs on older distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev tcl-dev fonts-dejavu-core xvfb x11-xserver-utils openbox \
            pulseaudio-utils

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Pixbot-x86_64.AppImage
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then export PIXBOT_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash linux/build_appimage.sh
          test -f dist/Pixbot-x86_64.AppImage

      - name: Run it on a virtual screen
        run: |
          chmod +x dist/Pixbot-x86_64.AppImage
          xvfb-run -a -s "-screen 0 1600x900x24" bash linux/smoke_test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pixbot-linux
          path: |
            dist/Pixbot-x86_64.AppImage
            build/smoke/

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Checksums
        run: |
          mkdir out
          cp dl/Pixbot-windows/Pixbot-Installer.exe dl/Pixbot-windows/Pixbot.exe \
             dl/Pixbot-linux/Pixbot-x86_64.AppImage out/
          cd out && sha256sum Pixbot-Installer.exe Pixbot.exe Pixbot-x86_64.AppImage | tee SHA256.txt

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" out/Pixbot-Installer.exe out/Pixbot.exe \
            out/Pixbot-x86_64.AppImage out/SHA256.txt --repo "${{ github.repository }}" \
            --title "Pixbot ${{ github.ref_name }}" --generate-notes
