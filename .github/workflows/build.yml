# Builds Pixbot.exe from this exact source code on GitHub's own servers,
# so anyone can see how the downloadable .exe was made.
#  - every push: builds the .exe and keeps it as a downloadable artifact
#  - pushing a tag like v1.0.0: also creates a Release with Pixbot.exe attached
name: Build Pixbot.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Pixbot.exe
        shell: pwsh
        run: ./build.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Pixbot.exe -Algorithm SHA256).Hash
          "$h  Pixbot.exe" | Out-File dist/SHA256.txt -Encoding ascii
          Write-Host "SHA256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: Pixbot
          path: |
            dist/Pixbot.exe
            dist/SHA256.txt

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/Pixbot.exe dist/SHA256.txt --title "Pixbot ${{ github.ref_name }}" --generate-notes
